# Description of the spec of the vericoding task in natural language
vc-description: |-
  [... some text description ...]

# Package opening, types and spec functions used in the `vc-spec` section
vc-preamble: |-
  package Some_Unit with SPARK_Mode is
  [... some subtypes and array types ...]
  [... some spec functions ...]

# The formal spec of the vericoding task, plus the package frame.
#
# Ada needs the helpers to sit in the package body, which cannot precede the
# specification, so `vc-spec` comes before `vc-helpers` in this track and
# carries the frame (`end Unit;` / `package body Unit ... is`) that separates
# them.  The frame is not editable, so it is safe here.
vc-spec: |-
  [... some subprogram declaration ...]
  [... some Pre aspect ...]
  [... some Post aspect ...]

  end Some_Unit;

  package body Some_Unit with SPARK_Mode is

# Helper subprograms for the body, as generated by the AI model
vc-helpers: |-

# Implementation and proof annotations, as generated by the AI model
vc-code: |-
     procedure Some_Subprogram (...) is
     begin
        pragma Assume (False);
     end Some_Subprogram;

# Closing frame
vc-postamble: |-
  end Some_Unit;
